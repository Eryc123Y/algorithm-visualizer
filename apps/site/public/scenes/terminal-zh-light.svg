<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 645 449" width="645" height="449" role="img" aria-label="algomotion 命令的一段终端会话"><title>algomotion 命令的一段终端会话</title><rect x="0.5" y="0.5" width="644" height="448" rx="6" fill="#ffffff" stroke="#dcdcda"/><g font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" xml:space="preserve" style="white-space:pre"><text x="18" y="28" fill="#161616"><tspan fill="#8a5500">$</tspan> algomotion export dijkstra --input &#39;A-B 4, B-C 1, A-C 7, C-D 2&#39; --step &#39;extr</text><text x="18" y="48" fill="#161616">act#1,extract#2,extract#3,extract#4&#39; --theme print --lang zh --out figures</text><text x="18" y="68" fill="#161616">figures/dijkstra-02.svg  extract</text><text x="18" y="88" fill="#161616">figures/dijkstra-05.svg  extract#2</text><text x="18" y="108" fill="#161616">figures/dijkstra-08.svg  extract#3</text><text x="18" y="128" fill="#161616">figures/dijkstra-12.svg  extract#4</text><text x="18" y="148" fill="#161616"><tspan fill="#8a5500">$</tspan> ls figures</text><text x="18" y="168" fill="#161616">dijkstra-02.svg</text><text x="18" y="188" fill="#161616">dijkstra-05.svg</text><text x="18" y="208" fill="#161616">dijkstra-08.svg</text><text x="18" y="228" fill="#161616">dijkstra-12.svg</text><text x="18" y="248" fill="#161616"><tspan fill="#8a5500">$</tspan> algomotion run dijkstra &#39;A-B 4, B-C 1, A-C 7, C-D 2&#39; --lang zh --out dijkstr</text><text x="18" y="268" fill="#161616">a.json</text><text x="18" y="288" fill="#161616"><tspan fill="#8a5500">$</tspan> algomotion inspect dijkstra.json improve#3 | head -2</text><text x="18" y="308" fill="#161616">Frame 7 of 0–14 · improve#3 · at improve (pseudocode line 11, python line 11)</text><text x="18" y="328" fill="#161616">narration: 4 + 1 = 5 &lt; 7：C 经由 B 改进为 5。</text><text x="18" y="348" fill="#161616"><tspan fill="#8a5500">$</tspan> algomotion run dijkstra &#39;A-B 4, B-C x&#39;</text><text x="18" y="368" fill="#a3261b">INVALID_NOTATION at $.input: Expected a weight or &quot;,&quot; after &quot;B-C&quot;, not &quot;x&quot; (ch</text><text x="18" y="388" fill="#a3261b">aracter 12) (hint: Write edges separated by commas, e.g. &quot;A-B 4, B-C 2&quot;: &quot;-&quot; j</text><text x="18" y="408" fill="#a3261b">oins an undirected edge and &quot;-&gt;&quot; a directed one, a weight goes after a space, </text><text x="18" y="428" fill="#a3261b">and a name alone is a node without edges; names are letters, digits and _.)</text></g></svg>
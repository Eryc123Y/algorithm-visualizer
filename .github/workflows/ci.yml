name: CI

# The repository is private on GitHub Free, so Actions minutes are limited
# (2,000 a month). Each run is one job of about 6 minutes, billed rounded up
# to the minute. Pull requests run it; merges to main do not run it again,
# as the pull request already tested the merge result. Changes that only
# touch documentation skip it, and a newer push cancels a running check.
on:
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

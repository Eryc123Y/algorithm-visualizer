name: Coverage

# The unit tests with coverage, which CI no longer collects on every pull
# request: the instrumentation makes the slowest tests about twice as slow,
# and no check reads the numbers. Run it by hand, and every Monday; the
# report is the run's artifact.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

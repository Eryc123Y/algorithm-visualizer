name: Something does not work
description: A command fails, the player breaks, a package will not compile, or an algorithm gives a wrong answer.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. Please search the open issues first. If a figure only looks wrong, use "A figure looks wrong" instead.
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - The player on a web page (<algo-player>)
        - The Typst package
        - The LaTeX package
        - Slides (Beamer, polylux or Touying)
        - The algomotion command
        - The MCP server or an AI assistant
        - A share link or the site
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Paste error messages as text.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The algorithm, its input, and the command, snippet or share link that shows the problem.
      placeholder: |
        algomotion export dijkstra --input 'A-B 4, B-C 1' --steps relax#3
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit you built from (`git rev-parse --short HEAD`), or the version in the site's footer.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Your operating system, and the browser, Node.js, Typst or TeX Live version that matters here.
